name: Deploy Pulse server

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["server/**", ".github/workflows/deploy-server.yml"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets are set
        run: |
          for s in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID APP_KEY; do
            if [ -z "${!s}" ]; then echo "::error::Missing repo secret $s (Settings → Secrets and variables → Actions)"; exit 1; fi
          done
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_KEY: ${{ secrets.APP_KEY }}
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
        working-directory: server
      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: server
          secrets: |
            APP_KEY
        env:
          APP_KEY: ${{ secrets.APP_KEY }}
      - name: Show your server address
        run: |
          echo "### ✅ Pulse server is live" >> $GITHUB_STEP_SUMMARY
          echo "Paste this into the Pulse app: **${{ steps.deploy.outputs.deployment-url }}**" >> $GITHUB_STEP_SUMMARY
